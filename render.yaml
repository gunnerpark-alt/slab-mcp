services:
  - type: web
    name: slab-mcp
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: NODE_VERSION
        value: "20"
      - key: CLAY_API_KEY
        sync: false
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: MANAGED_AGENT_ID
        sync: false
      - key: MANAGED_ENVIRONMENT_ID
        sync: false
      - key: MANAGED_VAULT_ID
        sync: false
      # KB feedback capture (reaction_added → Notion inbox). NOTION_TOKEN is the
      # same integration token the parse-job GitHub Action uses.
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_FEEDBACK_DB_ID
        value: a9c52f22474b47f2b26cb5cd805e6fb3
